target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "W", "B", "I", "UP", "C4", "SIM", "RUF"]
ignore = ["BLE001", "RUF013", "E501", "RUF001", "SIM102", "SIM105", "SIM108"]

[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Body",
    "app.dependencies.require_perm",
    "app.schemas.purchase.PurchaseReceive",
]

[lint.isort]
known-first-party = ["app", "system_api", "website_api", "admin_api", "admoon"]
[lint.per-file-ignores]
# These import models so SQLAlchemy registers them (and re-export them); nothing else uses the names.
"shared/backend/app/models/registry.py" = ["F401"]
"shared/backend/app/modules/healthcare/models.py" = ["F401"]
