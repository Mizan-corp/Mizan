[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan-sdk"
version = "0.1.0"
description = "Build, check and package community modules for Mizan, and talk to Mizan from your module's server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]
license = { text = "MIT" }

[project.scripts]
mizan = "mizan_sdk.cli:main"

[tool.setuptools]
packages = ["mizan_sdk"]
