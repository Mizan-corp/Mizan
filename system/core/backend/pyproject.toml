[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan-shared"
version = "1.0.0"
description = "Mizan domain kernel shared by the system, website and admin services: models, tenancy, auth, services and industry modules."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.12",
    "reportlab==4.2.5",
    "python-dotenv==1.0.1",
    "weasyprint==68.1",
    "openpyxl==3.1.5",
    "firebase-admin==6.6.0",
    "redis[hiredis]==5.2.1",
    "packaging==24.2",
    "jinja2==3.1.6",  # sandboxed site document rendering (ADR-015 S2)
    "nh3==0.3.2",  # HTML5 parser-based site rich-text sanitizer
    "tzdata>=2024.1",  # time zones (Africa/Cairo) where the system has none: containers, Windows installs
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["*.frontend*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.sql", "*.html", "*.md", "*.ttf", "*.txt"]
