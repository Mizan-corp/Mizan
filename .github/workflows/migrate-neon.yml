name: Migrate (Neon, temporary)

# Temporary while production runs on Vercel + Neon again (homie is down, ADR-011): Vercel
# deploys master pushes through its GitHub integration; this applies pending migrations to Neon
# on the same push (Vercel's builds take minutes, so the schema is normally ready first).
# Remove when production returns to the server (and re-enable "Deploy (server)").

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: neon-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ./shared/backend
      - name: Migrate Neon
        env:
          MIZAN_PROD_DATABASE_URL: ${{ secrets.MIZAN_PROD_DATABASE_URL }}
        run: python manage.py db migrate --production --yes --no-backup
