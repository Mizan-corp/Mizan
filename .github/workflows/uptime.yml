# Production uptime (ADR-011): every 5 minutes, from outside the server, check the apps, the four
# APIs (and their database), and the mail server. When something stays down for three tries an
# issue labelled "outage" is opened (GitHub emails the owner) and this run fails; when everything
# is back, the issue is closed with the time it was down.
name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Also check an address that is always down, to test the outage issue"
        type: boolean
        default: false

permissions:
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check
        id: check
        run: |
          pages="https://allmizan.live/ https://owner.allmizan.live/ https://admin.allmizan.live/ https://dev.allmizan.live/ https://mail.allmizan.live/"
          apis="https://api.allmizan.live/api/health https://owner-api.allmizan.live/api/health https://admin-api.allmizan.live/api/health https://web-api.allmizan.live/api/health"
          [ "${{ inputs.test_alert }}" = true ] && apis="$apis https://api.allmizan.live/api/uptime-test-always-down"
          ports="mail.allmizan.live:25 mail.allmizan.live:587 mail.allmizan.live:993"

          check_page() { [ "$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$1")" = 200 ]; }
          check_api()  { curl -s -m 20 "$1" | grep -q '"status":"ok"'; }   # "degraded" = database down
          check_port() { timeout 10 bash -c "echo > /dev/tcp/${1%:*}/${1#*:}" 2>/dev/null; }

          down=""
          for kind in page api port; do
            case $kind in page) list=$pages ;; api) list=$apis ;; port) list=$ports ;; esac
            for target in $list; do
              ok=no
              for try in 1 2 3; do
                if check_$kind "$target"; then ok=yes; break; fi
                sleep 20
              done
              [ $ok = yes ] || down="$down $target"
            done
          done
          echo "down=${down# }" >> "$GITHUB_OUTPUT"
          if [ -n "$down" ]; then echo "Down:$down"; else echo "All up"; fi

      - name: Open or update the outage issue
        if: steps.check.outputs.down != ''
        run: |
          gh label create outage --color B60205 --description "Production is (or was) down" 2>/dev/null || true
          open=$(gh issue list --label outage --state open --json number -q '.[0].number')
          body="Down at $(date -u '+%Y-%m-%d %H:%M UTC') (checked 3 times, 20 s apart):
          $(for t in ${{ steps.check.outputs.down }}; do echo "- \`$t\`"; done)

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "$open" ]; then
            gh issue create --title "Production down: ${{ steps.check.outputs.down }}" --label outage --body "$body"
          else
            # One comment per hour at most, so a long outage doesn't flood the issue.
            last=$(gh issue view "$open" --json comments -q '.comments[-1].createdAt // empty')
            if [ -z "$last" ] || [ $(( $(date +%s) - $(date -d "$last" +%s) )) -ge 3600 ]; then
              gh issue comment "$open" --body "$body"
            fi
          fi
          exit 1

      - name: Close the outage issue
        if: steps.check.outputs.down == ''
        run: |
          open=$(gh issue list --label outage --state open --json number,createdAt -q '.[0] | "\(.number) \(.createdAt)"')
          [ -n "$open" ] || exit 0
          num=${open%% *}; since=${open#* }
          mins=$(( ($(date +%s) - $(date -d "$since" +%s)) / 60 ))
          gh issue close "$num" --comment "Back up at $(date -u '+%Y-%m-%d %H:%M UTC'), after about $mins minutes."
