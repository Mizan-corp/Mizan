name: Deploy (homie)

# Manual production release to homie (allmizan.live). Run by hand: Actions > Deploy (homie) > Run workflow.
# 1. GitHub-hosted runner builds the two images and pushes them to GHCR, tagged with the commit.
# 2. The "deploy" job waits for approval of the `production` Environment (required reviewer),
#    then SSHes to homie as the restricted user `mizan-deploy`. Its key can run only one forced command
#    (`deploy <40-hex sha>`), which logs in to GHCR with this job's short-lived token and runs
#    /srv/mizan/deploy.sh (back up, migrate, switch, health check). See docs/deploy-homie.md.
# No push, pull_request or schedule trigger: fork PRs can never reach the key.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/server/Dockerfile.${{ matrix.image }}
          push: true
          tags: ghcr.io/mizan-corp/mizan-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Release on homie
    needs: build
    runs-on: ubuntu-latest
    environment: production   # required reviewer approves before this job (and its secret) starts
    concurrency:
      group: server-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Release over SSH (forced command)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key; chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf '%s\n' "$GH_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o PasswordAuthentication=no -o BatchMode=yes -o ServerAliveInterval=30 \
            mizan-deploy@"$DEPLOY_HOST" "deploy $GITHUB_SHA"
