name: Deploy (server)

# Production on the self-hosted server (deploy/server/README.md): a push to master is a release.
# The images build while CI runs; the release starts the moment CI passes on the commit:
# homie's runner pulls the new layers, backs up, migrates and switches (deploy/server/deploy.sh).
# A newer push supersedes an older one that hasn't deployed yet.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  build:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server/Dockerfile.${{ matrix.image }}
          push: true
          tags: ghcr.io/ammar0xff/mizan-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Release on homie
    needs: build
    runs-on: homie   # the runner on the server (registered with only this label)
    concurrency:
      group: server-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - name: Wait for CI on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
        run: |
          for i in $(seq 1 120); do
            state=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "$API/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" |
              python3 -c "import json,sys; r=json.load(sys.stdin)['workflow_runs']; print((r[0]['status']+' '+str(r[0]['conclusion'])) if r else 'none')")
            case "$state" in
              "completed success") echo "CI passed"; exit 0 ;;
              completed*) echo "CI didn't pass ($state): not deploying"; exit 1 ;;
            esac
            sleep 15
          done
          echo "CI didn't finish in 30 minutes"; exit 1

      - name: Only the latest master
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/commits/master" |
            python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
          if [ "$head" != "$GITHUB_SHA" ] && [ "${{ github.event_name }}" = push ]; then
            echo "master is now $head; its own run deploys it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.latest.outputs.skip != 'true'
        with:
          sparse-checkout: deploy/server
          sparse-checkout-cone-mode: true

      - name: Update the server's compose file and scripts
        if: steps.latest.outputs.skip != 'true'
        run: |
          cp deploy/server/compose.yaml deploy/server/deploy.sh deploy/server/backup.sh /srv/mizan/
          chmod +x /srv/mizan/deploy.sh /srv/mizan/backup.sh

      - name: Release
        if: steps.latest.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null' EXIT
          /srv/mizan/deploy.sh "$GITHUB_SHA"
