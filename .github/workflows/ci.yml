name: CI/CD

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── CI: lint + syntax + live e2e against the compose stack ───────────────
# Releases are .github/workflows/deploy-server.yml: it builds the images while this runs and
# releases a master commit on the server once this passes.

jobs:
  ci-frontend:
    name: Frontend CI (system · website · owner · admin)
    runs-on: ubuntu-latest   # hosted runner (self-hosted runners removed from the repo)
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false   # keep node_modules between runs (ci-deps.sh checks it against the lockfile)

      - name: Dependencies (cached on the runner)
        run: bash .github/ci-deps.sh node=24 npm

      - name: Run unit tests (shared + system)
        run: npm test

      - name: Type-check and build every app
        run: npm run build

  ci-backend:
    name: Backend CI
    runs-on: ubuntu-latest   # hosted runner (self-hosted runners removed from the repo)
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies (cached on the runner)
        run: bash .github/ci-deps.sh python=3.13 py=backend

      - name: Import check (system · website · owner · admin)
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci  # dummy — not connected at import
          SECRET_KEY: ci-secret-key-not-for-production-32ch
        run: |
          for svc in system/erp website owner admin; do
            (cd $svc/backend && python -c "import main; print('$svc:', len(main.app.routes), 'routes')")
          done

      - name: Lint
        run: ruff check system/core/backend system/erp/backend website/backend owner/backend admin/backend sdk/python --select E9,F63,F7,F82,F821,F601,F401,F841

  ci-e2e:
    name: E2E (live API)
    runs-on: ubuntu-latest   # hosted runner (self-hosted runners removed from the repo)
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false   # keep node_modules between runs (ci-deps.sh checks it against the lockfile)

      - name: Create dummy firebase credentials
        run: echo "{}" > firebase-service-account.json

      - name: Start stack (db + system/website/owner/admin APIs)
        # A fresh database each run (the runner's Docker keeps volumes); images stay cached.
        run: |
          docker compose down -v --remove-orphans >/dev/null 2>&1 || true
          docker compose up -d --build

      - name: Dependencies (cached on the runner)
        run: bash .github/ci-deps.sh python=3.12 py=e2e node=24 npm playwright weasyprint

      - name: Wait for health
        run: |
          for port in 8000 8001 8002 8003; do
            for i in $(seq 1 45); do
              curl -sf http://localhost:$port/health && break
              sleep 2
            done
            curl -sf http://localhost:$port/health
          done

      - name: Apply migrations
        run: python manage.py db migrate

      - name: Run e2e suite
        working-directory: e2e
        env:
          E2E_API_BASE: http://localhost:8000
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/inventory_db
        run: python -m pytest -q --no-header

      - name: Start the four dev servers (browser flows)
        run: |
          for w in system/erp website admin owner; do
            nohup npm run dev -w $w/frontend > /tmp/dev_${w##*/}.log 2>&1 &
          done
          for port in 5173 5174 5175 5176; do
            for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:$port && break; sleep 2; done
            curl -s -o /dev/null http://localhost:$port
          done

      - name: Browser flows (#80)
        working-directory: e2e
        env:
          E2E_BROWSER: "1"
          E2E_API_BASE: http://localhost:8000
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/inventory_db
        run: python -m pytest -q --no-header browser

      - name: Unit smoke test
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/inventory_db
          SECRET_KEY: ci-secret-key-not-for-production-32ch
        run: |
          (cd system/erp/backend && python -m pytest tests/ -q --no-header)
          (cd website/backend && python -m pytest tests/ -q --no-header)
          (cd owner/backend && python -m pytest tests/ -q --no-header)
          (cd admin/backend && python -m pytest tests/ -q --no-header)
          (cd installer/server && python -m pytest -q --no-header)
          (cd sdk/python && python -m pytest -q --no-header)

      - name: Debug container logs on failure
        if: failure()
        run: |
          docker compose logs
          tail -n 40 /tmp/dev_*.log || true

      - name: Stop the stack (frees the runner's memory)
        if: always()
        run: |
          pkill -f "vite" || true
          docker compose down -v --remove-orphans >/dev/null 2>&1 || true

  ci-manage:
    name: Manage script check
    runs-on: ubuntu-latest   # hosted runner (self-hosted runners removed from the repo)
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (cached on the runner)
        run: bash .github/ci-deps.sh python=3.13 py=backend
      - name: Syntax check
        working-directory: ./
        run: python -m py_compile manage.py
      - name: Help renders
        working-directory: ./
        run: python manage.py --help > /dev/null
