# Run one platform job by hand (Actions > Jobs > Run workflow). The five schedules now run from the server's
# own systemd timers (deploy/server/mizan-cron.sh, ADR-011): GitHub's scheduler is best effort and fired
# only 4 to 10 times a day instead of about 30. Each call is authenticated by CRON_SECRET, the same value as
# CRON_SECRET in the server's /srv/mizan/mizan.env. Job list: app/platform/automation_worker/runner.py (JOB_REGISTRY).
name: Jobs

on:
  workflow_dispatch:
    inputs:
      job:
        description: "One job (e.g. paymob_reconcile, measure_storage); empty runs paymob_reconcile"
        required: false

permissions: {}

jobs:
  run:
    runs-on: homie   # curls the production APIs; free on the server. Label is just "homie" (see .github/RUNNERS.md)
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SYSTEM_API: https://api.allmizan.live/api
      OWNER_API: https://owner-api.allmizan.live/api
    steps:
      - name: Pick the jobs
        id: pick
        run: echo "jobs=${{ inputs.job || 'paymob_reconcile' }}" >> "$GITHUB_OUTPUT"

      - name: Run
        run: |
          failed=0
          for job in ${{ steps.pick.outputs.jobs }}; do
            if [ "$job" = paymob_reconcile ]; then
              url="$OWNER_API/account/cron/paymob-reconcile"
            else
              url="$SYSTEM_API/modules/automation/cron/$job"
            fi
            code=$(curl -s -o out.json -w "%{http_code}" -X POST "$url" -H "X-Cron-Secret: $CRON_SECRET" --max-time 290)
            echo "$job → $code $(head -c 300 out.json)"
            [ "$code" = 200 ] || failed=1
          done
          exit $failed
