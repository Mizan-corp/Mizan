name: Deploy Frontend to Vercel

on:
  push:
    branches: [master, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for Vercel
        working-directory: frontend
        env:
          VITE_BASE: /
        run: npm run build

      - name: Deploy to Vercel via CLI
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Pulling Vercel environment info..."
            npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            echo "Building on Vercel..."
            npx --yes vercel build --prod --token="$VERCEL_TOKEN"
            echo "Deploying prebuilt artifacts to Vercel production..."
            DEPLOY_URL=$(npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
            echo "Deployed successfully to: $DEPLOY_URL"
            echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Trigger Vercel Deploy Hook (Fallback)
        if: env.HOOK_URL != ''
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_FRONTEND }}
        run: |
          echo "Triggering Vercel Frontend Deploy Hook..."
          curl -fsSL -X POST "$HOOK_URL"
          echo -e "\nHook triggered successfully."
