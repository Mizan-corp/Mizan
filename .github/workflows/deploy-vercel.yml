name: Deploy Frontend to Vercel

on:
  push:
    branches: [master, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for Vercel
        working-directory: frontend
        env:
          VITE_BASE: /
        run: npm run build

      - name: Trigger Vercel Deploy Hook (Frontend)
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            echo "Triggering Vercel Frontend Deploy Hook..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$HOOK_URL")
            echo "$RESPONSE"
            STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "✅ Frontend Deploy Hook triggered successfully!"
            else
              echo "⚠️ Frontend Deploy Hook returned status $STATUS"
            fi
          fi

      - name: Trigger Vercel Deploy Hook (Backend)
        env:
          BACKEND_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -n "$BACKEND_HOOK" ]; then
            echo "Triggering Vercel Backend Deploy Hook..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$BACKEND_HOOK")
            echo "$RESPONSE"
            STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "✅ Backend Deploy Hook triggered successfully!"
            else
              echo "⚠️ Backend Deploy Hook returned status $STATUS"
            fi
          fi

      - name: Deploy to Vercel via CLI (Optional)
        continue-on-error: true
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Pulling Vercel environment info..."
            npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN" || true
            npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" || true
          fi
