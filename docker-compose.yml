services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./shared/backend/app/db/baseline_schema.sql:/docker-entrypoint-initdb.d/00_baseline_schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── The ERP (system) ───
  system-api:
    build:
      context: .
      dockerfile: system/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/inventory_db
      # Same key on every service: a token issued by one is valid on the others.
      SECRET_KEY: ${SECRET_KEY:-local-dev-only-secret-key-change-me-0123456789abcdef}
      FIREBASE_CREDENTIALS: /app/firebase-service-account.json
    volumes:
      - ./system/backend:/app
      - ./shared/backend/app:/shared/app
      - uploads_data:/app/uploads
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── Website (signup / onboarding) ───
  website-api:
    build:
      context: .
      dockerfile: website/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/inventory_db
      # Same key on every service: a token issued by one is valid on the others.
      SECRET_KEY: ${SECRET_KEY:-local-dev-only-secret-key-change-me-0123456789abcdef}
    volumes:
      - ./website/backend:/app
      - ./shared/backend/app:/shared/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── Admin (Admoon control plane) ───
  admin-api:
    build:
      context: .
      dockerfile: admin/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/inventory_db
      # Same key on every service: a token issued by one is valid on the others.
      SECRET_KEY: ${SECRET_KEY:-local-dev-only-secret-key-change-me-0123456789abcdef}
    volumes:
      - ./admin/backend:/app
      - ./shared/backend/app:/shared/app
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pgdata:
  uploads_data: