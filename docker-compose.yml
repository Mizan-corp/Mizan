services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./system/core/backend/app/db/baseline_schema.sql:/docker-entrypoint-initdb.d/00_baseline_schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── The ERP (system) ───
  system-api:
    build:
      context: .
      dockerfile: system/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/inventory_db
      # Same key on every service: a token issued by one is valid on the others.
      SECRET_KEY: ${SECRET_KEY:-local-dev-only-secret-key-change-me-0123456789abcdef}
      # Owners' emails (codes, receipts) land in Mailpit: http://localhost:8025
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
      EMAIL_SMTP_TLS: ${EMAIL_SMTP_TLS:-false}
      FIREBASE_CREDENTIALS: /app/firebase-service-account.json
    volumes:
      - ./system/backend:/app
      - ./system/core/backend/app:/shared/app
      - uploads_data:/app/uploads
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── Website (signup / onboarding) ───
  website-api:
    build:
      context: .
      dockerfile: website/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/inventory_db
      # Same key on every service: a token issued by one is valid on the others.
      SECRET_KEY: ${SECRET_KEY:-local-dev-only-secret-key-change-me-0123456789abcdef}
      # Owners' emails (codes, receipts) land in Mailpit: http://localhost:8025
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
      EMAIL_SMTP_TLS: ${EMAIL_SMTP_TLS:-false}
    volumes:
      - ./website/backend:/app
      - ./system/core/backend/app:/shared/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── Admin (Admoon control plane) ───
  admin-api:
    build:
      context: .
      dockerfile: admin/backend/Dockerfile
    restart: unless-stopped
    environment:
      MIZAN_INSTALLERS: ${MIZAN_INSTALLERS:-}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/inventory_db
      # Same key on every service: a token issued by one is valid on the others.
      SECRET_KEY: ${SECRET_KEY:-local-dev-only-secret-key-change-me-0123456789abcdef}
      # Owners' emails (codes, receipts) land in Mailpit: http://localhost:8025
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
      EMAIL_SMTP_TLS: ${EMAIL_SMTP_TLS:-false}
    volumes:
      - ./admin/backend:/app
      - ./system/core/backend/app:/shared/app
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  owner-api:
    build:
      context: .
      dockerfile: owner/backend/Dockerfile
    restart: unless-stopped
    environment:
      MIZAN_INSTALLERS: ${MIZAN_INSTALLERS:-}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/inventory_db
      # Same key on every service: a token issued by one is valid on the others.
      SECRET_KEY: ${SECRET_KEY:-local-dev-only-secret-key-change-me-0123456789abcdef}
      # Owners' emails (codes, receipts) land in Mailpit: http://localhost:8025
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
      EMAIL_SMTP_TLS: ${EMAIL_SMTP_TLS:-false}
      OWNER_APP_URL: ${OWNER_APP_URL:-http://localhost:5176}
      OWNER_API_URL: ${OWNER_API_URL:-http://localhost:8003}
      PAYMOB_BASE_URL: ${PAYMOB_BASE_URL:-https://accept.paymob.com}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-}
      PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY:-}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-}
      PAYMOB_INTEGRATION_IDS: ${PAYMOB_INTEGRATION_IDS:-}
    volumes:
      - ./owner/backend:/app
      - ./system/core/backend/app:/shared/app
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Catches every email the local APIs send; read them at http://localhost:8025 (MAILPIT_PORT).
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  pgdata:
  uploads_data: