[package]
name = "mizan-setup"
version = "1.0.2"
description = "Mizan Setup: installs single-device and LAN Mizan"
edition = "2021"
publish = false

[lib]
name = "mizan_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
arboard = { version = "3", default-features = false }
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Registry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
# Embed the setup screens (frontendDist) instead of loading them from the dev server
# (devUrl, http://localhost:5180). `tauri build` turns this on by itself; build.py uses plain
# `cargo build`, so it must ask for it, or the installer opens on "Could not connect to localhost".
custom-protocol = ["tauri/custom-protocol"]
