# Mizan production on the k3s cluster (deploy/k3s/README.md, ADR-011).
# Applied by .github/workflows/deploy-server.yml after homie's release, with MIZAN_TAG replaced by
# the commit. Secrets (Secret mizan-env, from homie's /srv/mizan/mizan.env) and the image pull
# secret (ghcr, made from the release job's token) are created outside this file.
# The tunnel routes to http://api:8000 and http://web:8080, the same names as on homie's compose,
# so a connector here and homie's serve the same tunnel.

# The database stays on homie (compose, published on 127.0.0.1:15432); this bridge, on homie's
# network, forwards to it from homie's Tailscale address only (never the public interface).
apiVersion: apps/v1
kind: Deployment
metadata: {name: pg-bridge, namespace: mizan}
spec:
  replicas: 1
  selector: {matchLabels: {app: pg-bridge}}
  template:
    metadata: {labels: {app: pg-bridge}}
    spec:
      nodeSelector: {mizan/role: worker}   # homie
      hostNetwork: true
      containers:
        - name: socat
          image: alpine/socat:1.8.0.3
          env:
            - name: HOST_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
          args: ["-d", "TCP-LISTEN:15433,bind=$(HOST_IP),fork,reuseaddr", "TCP:127.0.0.1:15432"]
          ports: [{containerPort: 15433}]
          resources: {requests: {memory: 8Mi}, limits: {memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: mizan}
spec:
  selector: {app: pg-bridge}
  ports: [{port: 5432, targetPort: 15433}]
---
# Uploads live on homie's disk and are shared with latitude over NFS (Tailscale only).
apiVersion: v1
kind: PersistentVolume
metadata: {name: mizan-uploads}
spec:
  capacity: {storage: 20Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.2, hard]
  nfs: {server: 100.112.4.10, path: /srv/data/mizan/uploads}
  claimRef: {namespace: mizan, name: uploads}
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: mizan-private-uploads}
spec:
  capacity: {storage: 20Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.2, hard]
  nfs: {server: 100.112.4.10, path: /srv/data/mizan/private_uploads}
  claimRef: {namespace: mizan, name: private-uploads}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: uploads, namespace: mizan}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: mizan-uploads
  resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: private-uploads, namespace: mizan}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: mizan-private-uploads
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: mizan}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  strategy: {rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata: {labels: {app: api}}
    spec:
      nodeSelector: {mizan/role: control}   # latitude; homie's 2 GB runs the compose copy
      imagePullSecrets: [{name: ghcr}]
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: ghcr.io/ammar0xff/mizan-api:MIZAN_TAG
          imagePullPolicy: IfNotPresent
          envFrom: [{secretRef: {name: mizan-env}}]
          env:   # as in deploy/server/compose.yaml
            - {name: APP_ENV, value: production}
            - {name: MIZAN_BEHIND_CLOUDFLARE, value: "1"}
            - {name: UPLOAD_DIR, value: /data/uploads}
            - {name: PRIVATE_UPLOAD_DIR, value: /data/private_uploads}
            - {name: OWNER_API_URL, value: https://owner-api.allmizan.live/api}
            - {name: OWNER_APP_URL, value: https://allmizan.live/owner}
            - {name: CORS_ORIGINS, value: '["https://allmizan.live", "https://dev.allmizan.live"]'}
          ports: [{containerPort: 8000}]
          volumeMounts:
            - {name: uploads, mountPath: /data/uploads}
            - {name: private-uploads, mountPath: /data/private_uploads}
          startupProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 30, failureThreshold: 4}
          resources: {requests: {memory: 300Mi, cpu: 100m}, limits: {memory: 900Mi}}
      volumes:
        - {name: uploads, persistentVolumeClaim: {claimName: uploads}}
        - {name: private-uploads, persistentVolumeClaim: {claimName: private-uploads}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: mizan}
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: mizan}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  strategy: {rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata: {labels: {app: web}}
    spec:
      nodeSelector: {mizan/role: control}
      imagePullSecrets: [{name: ghcr}]
      containers:
        - name: web
          image: ghcr.io/ammar0xff/mizan-web:MIZAN_TAG
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}, periodSeconds: 10}
          resources: {requests: {memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: mizan}
spec:
  selector: {app: web}
  ports: [{port: 8080, targetPort: 8080}]
---
# A second connector of homie's tunnel: Cloudflare spreads requests over every healthy connector,
# so either machine keeps the apps up. Kept at 0 until the cluster copy has been checked.
apiVersion: apps/v1
kind: Deployment
metadata: {name: tunnel, namespace: mizan}
spec:
  replicas: 0
  selector: {matchLabels: {app: tunnel}}
  template:
    metadata: {labels: {app: tunnel}}
    spec:
      nodeSelector: {mizan/role: control}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.11.0
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: {secretKeyRef: {name: mizan-env, key: TUNNEL_TOKEN}}
          readinessProbe: {httpGet: {path: /ready, port: 2000}, periodSeconds: 10}
          resources: {requests: {memory: 32Mi}, limits: {memory: 128Mi}}
