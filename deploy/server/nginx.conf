# The four Mizan apps on the self-hosted server (replaces each app's vercel.json).
#   allmizan.live      -> the website: pre-rendered pages, real 404s (ADR-016); /owner/, /admin/ -> those panels (ADR-008)
#   dev.allmizan.live  -> the developer platform (the website's app, ADR-007 D6)
#   www.allmizan.live  -> redirect to the apex
#   any other host (<workspace>.allmizan.live, app.allmizan.live) -> the ERP, never indexed
# TLS ends at Cloudflare; the tunnel reaches this server over plain HTTP inside the cluster.
# Cloudflare also compresses with brotli for browsers that take it; here files go out gzipped,
# from the .gz copies the image makes at build time (gzip_static).

map $uri $mizan_cache {
    default                         "no-cache";
    ~^/(owner/|admin/)?assets/      "public, max-age=31536000, immutable";
    ~^/(og|icons)/                  "public, max-age=604800";
    ~^/(favicon\.ico|icon\.svg)$    "public, max-age=604800";
}

# Addresses that moved: every /features/<slug> used to show the inventory page (ADR-016).
map $uri $mizan_moved {
    default                 "";
    /features/details       /features/inventory;
    /features/finance       /docs/modules/accounting;
    /features/sales         /docs/modules/pos;
    /features/hr            /docs/modules/hr;
    /features/purchasing    /docs/modules/purchasing;
    /features/projects      /features;
    /blog/escpos-zatca-phase-2-thermal-printing  /blog;
}

server {
    listen 8080;
    server_name www.allmizan.live;
    return 301 https://allmizan.live$request_uri;
}

# The website. Every public page is a file (dist/<path>/index.html); anything else is a 404 with
# the branded "page not found". One address per page: no trailing slash, no /index.html.
server {
    listen 8080;
    server_name allmizan.live;
    root /srv/web/website;
    include /etc/nginx/mizan-common.conf;
    include /etc/nginx/mizan-panels.conf;
    error_page 404 /404.html;

    if ($mizan_moved) { return 301 $mizan_moved; }

    # The developer platform has its own host.
    location ~ ^/dev(?:/(.*))?$ { return 301 https://dev.allmizan.live/$1$is_args$args; }

    # Application pages (signup, onboarding, the owner's session hand-off): the app shell, never indexed.
    location ~ ^/(?:signup|onboarding|login|session|signout|en/signup)$ {
        include /etc/nginx/mizan-panel-headers.conf;
        try_files /spa.html =404;
    }

    location = /404.html { internal; }
    location = /en/404.html { internal; }
    location = /spa.html { internal; }
    location = /dev.html { internal; }
    location = /robots-dev.txt { internal; }
    location = /manifest.webmanifest { default_type application/manifest+json; }

    location /en/ {
        error_page 404 /en/404.html;
        rewrite ^(.+)/index\.html$ $1 permanent;
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri/index.html =404;
    }
    location / {
        rewrite ^/index\.html$ / permanent;
        rewrite ^(.+)/index\.html$ $1 permanent;
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri/index.html =404;
    }
}

# The developer platform: the website's app shell (its router shows the portal at the root).
# Its own robots.txt and no sitemap; whether its pages are indexed is the portal's decision.
server {
    listen 8080;
    server_name dev.allmizan.live;
    root /srv/web/website;
    include /etc/nginx/mizan-common.conf;
    include /etc/nginx/mizan-panels.conf;

    location = /robots.txt { try_files /robots-dev.txt =404; }
    location = /sitemap.xml { return 404; }
    location ^~ /sitemaps/ { return 404; }
    location / {
        try_files $uri /dev.html;
    }
}

# The ERP (and the workspaces' own hosts): an application, kept out of search engines.
server {
    listen 8080 default_server;
    server_name _;
    root /srv/web/system;
    include /etc/nginx/mizan-common.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location / {
        try_files $uri /index.html;
    }
}
