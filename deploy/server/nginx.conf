# The four Mizan apps on the self-hosted server (replaces each app's vercel.json).
#   allmizan.live, dev.allmizan.live -> website (and /owner/, /admin/ -> those panels, ADR-008)
#   www.allmizan.live                -> redirect to the apex
#   any other host (<workspace>.allmizan.live, app.allmizan.live) -> the ERP
# TLS ends at Cloudflare; the tunnel reaches this server over plain HTTP inside the cluster.

map $uri $mizan_cache {
    default                    "no-cache";
    ~^/(owner/|admin/)?assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name www.allmizan.live;
    return 301 https://allmizan.live$request_uri;
}

server {
    listen 8080;
    server_name allmizan.live dev.allmizan.live;
    root /srv/web/website;
    include /etc/nginx/mizan-common.conf;

    location = /owner { return 301 /owner/; }
    location = /admin { return 301 /admin/; }
    location /owner/ {
        root /srv/web/panels;
        include /etc/nginx/mizan-panel-headers.conf;
        try_files $uri /owner/index.html;
    }
    location /admin/ {
        root /srv/web/panels;
        include /etc/nginx/mizan-panel-headers.conf;
        try_files $uri /admin/index.html;
    }
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 8080 default_server;
    server_name _;
    root /srv/web/system;
    include /etc/nginx/mizan-common.conf;

    location / {
        try_files $uri /index.html;
    }
}
