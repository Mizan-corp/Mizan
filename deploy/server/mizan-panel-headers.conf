# The owner and admin panels: never framed, never indexed (as their vercel.json said).
# add_header in a location replaces the server's, so the common ones are repeated here.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cache-Control $mizan_cache always;
